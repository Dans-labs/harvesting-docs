[project]
name = "harvesting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paulboon", email = "paul.boon@dans.knaw.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-argparse>=1.7.0",
]

[project.scripts]
oai-pmh = "harvesting:main"
dv-export-api = "harvesting:main_dv_export_api"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "mkdocs-material>=9.8.0",
]
explore = [
    "pymongo>=4.9",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "pyvis>=0.3.2",
]
